<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<title>图片查看</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
  font-size: 13px;
  background: linear-gradient(180deg, #f8f9fb 0%, #f0f1f5 100%);
  color: #1d1d1f;
  border-radius: 12px;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.titlebar {
  -webkit-app-region: drag;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 12px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 0.5px solid rgba(0,0,0,0.06);
  flex-shrink: 0;
}
.titlebar-title {
  font-size: 14px;
  font-weight: 600;
  color: #1d1d1f;
  letter-spacing: -0.3px;
}
.titlebar-btns {
  -webkit-app-region: no-drag;
  display: flex;
  gap: 8px;
  align-items: center;
}
.win-btn {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 8px;
  line-height: 12px;
  text-align: center;
  color: transparent;
  font-weight: bold;
  transition: all 0.1s;
}
.win-btn:hover { color: rgba(0,0,0,0.5); }
.win-btn.minimize { background: #ffbd2e; }
.win-btn.close { background: #ff5f57; }
.pin-btn {
  background: none;
  border: none;
  font-size: 14px;
  cursor: pointer;
  padding: 2px 5px;
  border-radius: 4px;
  opacity: 0.35;
  transition: all 0.2s;
}
.pin-btn:hover { opacity: 0.65; background: rgba(0,0,0,0.04); }
.pin-btn.active { opacity: 1; transform: rotate(45deg); }
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.top-pane {
  height: 45%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 0 0.5px rgba(0,0,0,0.06);
  position: relative;
  overflow: hidden;
}
.top-pane::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-conic-gradient(rgba(0,0,0,0.015) 0% 25%, transparent 0% 50%) 0 0 / 16px 16px;
  pointer-events: none;
}
.top-pane img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 8px;
  object-fit: contain;
  cursor: zoom-in;
  position: relative;
  z-index: 1;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.top-pane img:hover {
  transform: scale(1.015);
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.zoom-hint {
  position: absolute;
  bottom: 10px;
  right: 14px;
  font-size: 10px;
  color: #aaa;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.top-pane:hover .zoom-hint { opacity: 1; }
.bottom-pane {
  flex: 1;
  display: flex;
  gap: 0;
  min-height: 0;
}
.bottom-divider {
  width: 5px;
  cursor: col-resize;
  flex-shrink: 0;
  position: relative;
  transition: background 0.2s;
}
.bottom-divider:hover, .bottom-divider.active {
  background: rgba(0,122,255,0.12);
}
.bottom-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 3px;
  height: 28px;
  border-radius: 2px;
  background: rgba(0,0,0,0.08);
  transition: background 0.2s;
}
.bottom-divider:hover::after, .bottom-divider.active::after {
  background: rgba(0,122,255,0.35);
}
.panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  min-height: 0;
  background: #ffffff;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 0 0.5px rgba(0,0,0,0.06);
}
#ocrPanel { flex: 1; }
#chatPanel { flex: 2; }
.section-label {
  font-size: 10px;
  color: #999;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.ocr-result {
  flex: 1;
  background: #f8f9fb;
  border: 1px solid #eef0f3;
  border-radius: 10px;
  padding: 12px 14px;
  overflow-y: auto;
  font-size: 12.5px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
  color: #333;
}
.ocr-result::-webkit-scrollbar { width: 4px; }
.ocr-result::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
.actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.btn {
  padding: 7px 14px;
  border-radius: 8px;
  border: none;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-primary {
  background: linear-gradient(180deg, #3a8fff 0%, #007aff 100%);
  color: #fff;
  box-shadow: 0 1px 3px rgba(0,122,255,0.25);
}
.btn-primary:hover {
  background: linear-gradient(180deg, #4d9aff 0%, #0a84ff 100%);
  box-shadow: 0 3px 10px rgba(0,122,255,0.35);
  transform: translateY(-0.5px);
}
.btn-primary:disabled { background: #cde4ff; box-shadow: none; transform: none; cursor: default; }
.btn-secondary {
  background: #f0f1f5;
  color: #444;
}
.btn-secondary:hover { background: #e6e7ec; }
.chat-history {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 2px;
  min-height: 60px;
}
.chat-history::-webkit-scrollbar { width: 4px; }
.chat-history::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
.chat-msg {
  padding: 9px 13px;
  border-radius: 14px;
  font-size: 12.5px;
  line-height: 1.55;
  word-break: break-word;
  max-width: 88%;
  animation: msgIn 0.2s ease;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.chat-msg.user {
  background: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.chat-msg.ai {
  background: #f0f1f5;
  color: #1d1d1f;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.chat-msg.ai p { margin: 0 0 6px; }
.chat-msg.ai p:last-child { margin-bottom: 0; }
.chat-msg.ai code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 3px; font-size: 11.5px; }
.chat-msg.ai pre { background: rgba(0,0,0,0.05); padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 6px 0; }
.chat-msg.ai pre code { background: none; padding: 0; }
.chat-msg.ai ul, .chat-msg.ai ol { padding-left: 18px; margin: 4px 0; }
.chat-msg.ai h1, .chat-msg.ai h2, .chat-msg.ai h3 { font-size: 12.5px; margin: 8px 0 4px; }
.chat-msg.ai table { border-collapse: collapse; margin: 6px 0; font-size: 11px; }
.chat-msg.ai th, .chat-msg.ai td { border: 1px solid #ddd; padding: 4px 8px; }
.chat-msg.ai th { background: #f5f5f5; }
.chat-msg.error { background: #fff0f0; color: #ff3b30; align-self: flex-start; }
.chat-input-row {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  margin-top: auto;
  padding-top: 8px;
  flex-direction: column;
}
.quick-questions {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding-bottom: 4px;
}
.quick-q {
  padding: 4px 10px;
  border-radius: 12px;
  border: 1px solid #e5e5ea;
  background: #f8f9fb;
  font-size: 10.5px;
  color: #555;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.quick-q:hover { background: #eef0f5; border-color: #007aff; color: #007aff; }
.quick-q.clear-q { border-color: #ffcdd2; color: #e53935; }
.quick-q.clear-q:hover { background: #fff0f0; border-color: #e53935; }
.input-resize-handle {
  width: 40px;
  height: 8px;
  margin: 0 auto 2px;
  cursor: ns-resize;
  display: flex;
  align-items: center;
  justify-content: center;
}
.input-resize-handle::after {
  content: '';
  width: 28px;
  height: 3px;
  border-radius: 2px;
  background: #ddd;
  transition: background 0.2s;
}
.input-resize-handle:hover::after { background: #aaa; }
.input-row-inner {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.chat-input {
  flex: 1;
  padding: 9px 14px;
  border-radius: 16px;
  border: 1px solid #e5e5ea;
  background: #f8f9fb;
  color: #1d1d1f;
  font-size: 12.5px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  resize: none;
  min-height: 36px;
  max-height: 200px;
  line-height: 1.4;
  overflow-y: auto;
}
.chat-input:focus { border-color: #007aff; background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
.chat-send {
  padding: 9px 18px;
  border-radius: 22px;
  border: none;
  background: linear-gradient(135deg, #7c4dff 0%, #6a3de8 100%);
  color: #fff;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 1px 4px rgba(124,77,255,0.25);
}
.chat-send:hover { box-shadow: 0 3px 12px rgba(124,77,255,0.4); transform: translateY(-0.5px); }
.chat-send:disabled { background: #e5e5ea; color: #86868b; cursor: default; box-shadow: none; transform: none; }
.main-layout {
  flex: 1;
  display: flex;
  min-height: 0;
}
.main-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 14px;
  min-height: 0;
  min-width: 0;
}
.resize-handle {
  width: 5px;
  cursor: col-resize;
  background: transparent;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  transition: background 0.2s;
}
.resize-handle:hover, .resize-handle.active {
  background: rgba(0,122,255,0.15);
}
.resize-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 3px;
  height: 32px;
  border-radius: 2px;
  background: rgba(0,0,0,0.1);
  transition: background 0.2s;
}
.resize-handle:hover::after, .resize-handle.active::after {
  background: rgba(0,122,255,0.4);
}
.history-sidebar {
  width: 200px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-left: 0.5px solid rgba(0,0,0,0.06);
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  min-width: 120px;
  max-width: 400px;
}
.sidebar-header {
  font-size: 10px;
  font-weight: 600;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 14px 12px 8px;
  flex-shrink: 0;
}
.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px 8px;
}
.sidebar-list::-webkit-scrollbar { width: 3px; }
.sidebar-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
.sidebar-item {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 11px;
  line-height: 1.4;
  color: #444;
  cursor: pointer;
  margin-bottom: 4px;
  transition: background 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  position: relative;
}
.sidebar-item:hover { background: rgba(0,0,0,0.04); }
.sidebar-item.is-image {
  height: 48px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sidebar-item.is-image img {
  height: 32px;
  width: 48px;
  object-fit: cover;
  border-radius: 4px;
}
.sidebar-item .copied-tip {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 9px;
  color: #34c759;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.2s;
}
.sidebar-item .copied-tip.show { opacity: 1; }
</style>
</head>
<body>
<div class="titlebar">
  <span class="titlebar-title">图片查看</span>
  <div class="titlebar-btns">
    <button class="pin-btn" id="pinBtn" title="置顶">📌</button>
    <button class="win-btn minimize" id="minimizeBtn">−</button>
    <button class="win-btn close" id="closeBtn">✕</button>
  </div>
</div>
<div class="content">
  <div class="main-layout">
    <div class="main-left">
      <div class="top-pane">
        <img id="previewImg"/>
        <span class="zoom-hint">点击放大</span>
      </div>
      <div class="bottom-pane">
        <div class="panel" id="ocrPanel">
          <div class="section-label">识别结果</div>
          <div class="ocr-result" id="ocrResult">点击下方按钮开始识别...</div>
          <div class="actions">
            <button class="btn btn-primary" id="ocrBtn">OCR 识别</button>
            <button class="btn btn-primary" id="aiRecBtn">AI 识别</button>
            <button class="btn btn-secondary" id="copyBtn">复制文字</button>
          </div>
        </div>
        <div class="bottom-divider" id="bottomDivider"></div>
        <div class="panel" id="chatPanel">
          <div class="section-label">AI 问询</div>
          <div class="chat-history" id="chatHistory"></div>
          <div class="chat-input-row" id="chatInputRow">
            <div class="quick-questions" id="quickQuestions">
              <span class="quick-q">翻译成中文</span>
              <span class="quick-q">翻译成英文</span>
              <span class="quick-q">总结要点</span>
              <span class="quick-q">解释含义</span>
              <span class="quick-q">广告指标分析</span>
              <span class="quick-q clear-q">清空</span>
            </div>
            <div class="input-resize-handle" id="inputResizeHandle"></div>
            <div class="input-row-inner">
              <textarea class="chat-input" id="chatInput" placeholder="基于图片内容提问..." rows="1"></textarea>
              <button class="chat-send" id="chatSend">发送</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="resize-handle" id="resizeHandle"></div>
    <div class="history-sidebar" id="historySidebar">
      <div class="sidebar-header">剪贴板历史</div>
      <div class="sidebar-list" id="sidebarList"></div>
    </div>
  </div>
</div>
<script src="node_modules/marked/lib/marked.umd.js"></script>
<script>
let imageData = ''
let ocrText = ''
let itemTs = null
let chatMessages = []

try {
  const hash = location.hash.slice(1)
  if (hash) {
    const data = JSON.parse(decodeURIComponent(hash))
    imageData = data.dataUrl || ''
    ocrText = data.ocrText || ''
    itemTs = data.ts || null
    chatMessages = data.chatHistory || []
    document.getElementById('previewImg').src = imageData
    if (ocrText) document.getElementById('ocrResult').textContent = ocrText
    if (chatMessages.length) {
      chatMessages.forEach(msg => {
        const el = document.createElement('div')
        el.className = 'chat-msg ' + msg.role
        if (msg.role === 'ai') {
          el.innerHTML = marked.parse(msg.text)
        } else {
          el.textContent = msg.text
        }
        document.getElementById('chatHistory').appendChild(el)
      })
    }
  }
} catch {}

document.getElementById('closeBtn').onclick = () => window.close()
document.getElementById('minimizeBtn').onclick = () => window.api.minimizeWindow()

let pinned = false
document.getElementById('pinBtn').onclick = () => {
  pinned = !pinned
  document.getElementById('pinBtn').classList.toggle('active', pinned)
  window.api.setAlwaysOnTop(pinned)
}

document.getElementById('previewImg').onclick = () => {
  window.api.openImageFull(imageData)
}

const ocrResult = document.getElementById('ocrResult')

document.getElementById('ocrBtn').onclick = async () => {
  const btn = document.getElementById('ocrBtn')
  btn.textContent = '识别中...'
  btn.disabled = true
  const res = await window.api.ocrImage(imageData)
  btn.textContent = 'OCR 识别'
  btn.disabled = false
  if (res.error) { ocrResult.textContent = '错误: ' + res.error }
  else { ocrText = res.text; ocrResult.textContent = ocrText }
}

document.getElementById('aiRecBtn').onclick = async () => {
  const btn = document.getElementById('aiRecBtn')
  btn.textContent = '识别中...'
  btn.disabled = true
  const res = await window.api.recognizeImage(imageData)
  btn.textContent = 'AI 识别'
  btn.disabled = false
  if (res.error) { ocrResult.textContent = '错误: ' + res.error }
  else { ocrText = res.text; ocrResult.textContent = ocrText }
}

document.getElementById('copyBtn').onclick = () => {
  if (!ocrText) return
  navigator.clipboard.writeText(ocrText)
  const btn = document.getElementById('copyBtn')
  btn.textContent = '已复制!'
  setTimeout(() => btn.textContent = '复制文字', 1500)
}

const chatHistory = document.getElementById('chatHistory')
const chatInput = document.getElementById('chatInput')
const chatSend = document.getElementById('chatSend')

function sendQuestion() {
  const q = chatInput.value.trim()
  if (!q) return
  const userMsg = document.createElement('div')
  userMsg.className = 'chat-msg user'
  userMsg.textContent = q
  chatHistory.appendChild(userMsg)
  chatInput.value = ''
  chatInput.style.height = '36px'
  chatSend.disabled = true
  chatSend.textContent = '停止'
  chatMessages.push({ role: 'user', text: q })

  const aiMsg = document.createElement('div')
  aiMsg.className = 'chat-msg ai'
  chatHistory.appendChild(aiMsg)
  chatHistory.scrollTop = chatHistory.scrollHeight
  let aiRawText = ''

  window.api.removeAiAskListeners()
  window.api.onAiAskChunk(text => {
    aiRawText += text
    aiMsg.innerHTML = marked.parse(aiRawText)
    chatHistory.scrollTop = chatHistory.scrollHeight
  })
  window.api.onAiAskDone(() => {
    chatMessages.push({ role: 'ai', text: aiRawText })
    if (itemTs) window.api.saveChatHistory(itemTs, chatMessages)
    chatSend.disabled = false
    chatSend.textContent = '发送'
    chatSend.onclick = sendQuestion
    window.api.removeAiAskListeners()
  })
  window.api.onAiAskError(msg => {
    aiMsg.className = 'chat-msg error'
    aiMsg.textContent = msg
    chatSend.disabled = false
    chatSend.textContent = '发送'
    chatSend.onclick = sendQuestion
    window.api.removeAiAskListeners()
  })
  window.api.aiAskStream(imageData, q)
  chatSend.onclick = () => {
    window.api.aiAskAbort()
    window.api.removeAiAskListeners()
    chatSend.disabled = false
    chatSend.textContent = '发送'
    chatSend.onclick = sendQuestion
  }
}
chatSend.onclick = sendQuestion
chatInput.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !chatSend.disabled) {
    e.preventDefault()
    sendQuestion()
  }
}
chatInput.oninput = () => {
  chatInput.style.height = 'auto'
  chatInput.style.height = Math.min(chatInput.scrollHeight, 200) + 'px'
}

const quickPrompts = {
  '广告指标分析': '图片中LC是全量，另一个是小流量，_avg指标是队列，count是请求数，请你计算小流量相比全量的增减，计算方式_avg*count，但是小流量和全量的比例是：RTA上小流量:全量是1:5，RTB上是1:6，凡是ADXRTA_*开头的都是RTA，T开头的实验是RTB'
}
document.querySelectorAll('.quick-q').forEach(btn => {
  btn.onclick = () => {
    if (btn.classList.contains('clear-q')) {
      chatHistory.innerHTML = ''
      chatMessages = []
      if (itemTs) window.api.saveChatHistory(itemTs, chatMessages)
      return
    }
    chatInput.value = quickPrompts[btn.textContent] || btn.textContent
    sendQuestion()
  }
})

;(function() {
  const handle = document.getElementById('inputResizeHandle')
  const input = document.getElementById('chatInput')
  let startY, startH
  handle.addEventListener('mousedown', e => {
    e.preventDefault()
    startY = e.clientY
    startH = input.offsetHeight
    document.body.style.cursor = 'ns-resize'
    document.body.style.userSelect = 'none'
    const onMove = ev => {
      const diff = startY - ev.clientY
      const newH = Math.min(200, Math.max(36, startH + diff))
      input.style.height = newH + 'px'
    }
    const onUp = () => {
      document.body.style.cursor = ''
      document.body.style.userSelect = ''
      document.removeEventListener('mousemove', onMove)
      document.removeEventListener('mouseup', onUp)
    }
    document.addEventListener('mousemove', onMove)
    document.addEventListener('mouseup', onUp)
  })
})()

async function loadSidebar() {
  const history = await window.api.getHistory()
  const list = document.getElementById('sidebarList')
  list.innerHTML = ''
  history.forEach(item => {
    const el = document.createElement('div')
    el.className = 'sidebar-item' + (item.type === 'image' ? ' is-image' : '')
    if (item.type === 'image') {
      const img = document.createElement('img')
      img.src = item.value
      el.appendChild(img)
      const span = document.createElement('span')
      span.textContent = item.ocrText || '图片'
      el.appendChild(span)
    } else {
      el.textContent = item.value
    }
    const tip = document.createElement('span')
    tip.className = 'copied-tip'
    tip.textContent = '已复制'
    el.appendChild(tip)
    el.onmouseenter = (e) => {
      let html = ''
      if (item.type === 'image') {
        html = `<img src="${item.value}"/>`
      } else {
        const escaped = item.value.slice(0, 500).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        html = `<div class="preview-text">${escaped}</div>`
      }
      const rect = el.getBoundingClientRect()
      const winW = window.innerWidth
      const popW = 280
      const popH = 200
      let top = rect.top + rect.height / 2 - popH / 2
      top = Math.max(10, Math.min(top, window.innerHeight - popH - 10))
      window.api.showPreviewPopup({ html, x: winW + 6, y: Math.round(top), width: popW, height: popH })
    }
    el.onmouseleave = () => {
      window.api.hidePreviewPopup()
    }
    el.onclick = () => {
      const copyText = item.type === 'image' ? (item.ocrText || '') : item.value
      if (!copyText) return
      navigator.clipboard.writeText(copyText)
      tip.classList.add('show')
      setTimeout(() => tip.classList.remove('show'), 1200)
    }
    list.appendChild(el)
  })
}
loadSidebar()
window.api.onHistoryUpdate(loadSidebar)

// Resize handle
;(function() {
  const handle = document.getElementById('resizeHandle')
  const sidebar = document.getElementById('historySidebar')
  let startX, startW
  handle.addEventListener('mousedown', e => {
    e.preventDefault()
    startX = e.clientX
    startW = sidebar.offsetWidth
    handle.classList.add('active')
    document.body.style.cursor = 'col-resize'
    document.body.style.userSelect = 'none'
    const onMove = ev => {
      const diff = startX - ev.clientX
      const newW = Math.min(400, Math.max(120, startW + diff))
      sidebar.style.width = newW + 'px'
    }
    const onUp = () => {
      handle.classList.remove('active')
      document.body.style.cursor = ''
      document.body.style.userSelect = ''
      document.removeEventListener('mousemove', onMove)
      document.removeEventListener('mouseup', onUp)
    }
    document.addEventListener('mousemove', onMove)
    document.addEventListener('mouseup', onUp)
  })
})()

// Bottom divider between OCR and AI panels
;(function() {
  const divider = document.getElementById('bottomDivider')
  const ocrPanel = document.getElementById('ocrPanel')
  const chatPanel = document.getElementById('chatPanel')
  let startX, ocrW, chatW
  divider.addEventListener('mousedown', e => {
    e.preventDefault()
    startX = e.clientX
    ocrW = ocrPanel.offsetWidth
    chatW = chatPanel.offsetWidth
    divider.classList.add('active')
    document.body.style.cursor = 'col-resize'
    document.body.style.userSelect = 'none'
    const onMove = ev => {
      const diff = ev.clientX - startX
      const newOcr = Math.max(150, ocrW + diff)
      const newChat = Math.max(150, chatW - diff)
      ocrPanel.style.flex = 'none'
      chatPanel.style.flex = 'none'
      ocrPanel.style.width = newOcr + 'px'
      chatPanel.style.width = newChat + 'px'
    }
    const onUp = () => {
      divider.classList.remove('active')
      document.body.style.cursor = ''
      document.body.style.userSelect = ''
      document.removeEventListener('mousemove', onMove)
      document.removeEventListener('mouseup', onUp)
    }
    document.addEventListener('mousemove', onMove)
    document.addEventListener('mouseup', onUp)
  })
})()
</script>
